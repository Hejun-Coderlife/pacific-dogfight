<script type="module">
import * as THREE from 'three';
import { Water } from 'three/addons/objects/Water.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ---------- 参数 ----------
const P = {
  sunElev: 5, sunAzim: 8,
  exposure: 0.55, fogDensity: 6.5e-5,
  bloomStrength: 0.35, bloomRadius: 0.6, bloomThreshold: 2.2,
  pixelRatio: Math.min(devicePixelRatio, 1.25),
};

// ---------- 噪声工具 ----------
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash2(x, y, s) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s = 0, oct = 5) {
  let sum = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * f, y * f, s + i * 17); norm += amp; amp *= 0.5; f *= 2.03; }
  return sum / norm;
}
const smoothstep = (e0, e1, x) => { const t = Math.min(1, Math.max(0, (x - e0) / (e1 - e0))); return t * t * (3 - 2 * t); };

// ---------- 渲染器 / 场景 ----------
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(P.pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = P.exposure;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbbbbbb, P.fogDensity);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 1, 60000);

// ---------- 天空 ----------
const sky = new Sky();
sky.scale.setScalar(10000);
const su = sky.material.uniforms;
su.turbidity.value = 8; su.rayleigh.value = 2.2; su.mieCoefficient.value = 0.006; su.mieDirectionalG.value = 0.82;
scene.add(sky);
const envScene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

const sunLight = new THREE.DirectionalLight(0xffffff, 3);
scene.add(sunLight);
const hemi = new THREE.HemisphereLight(0x8fb4d8, 0x1a3a44, 0.35);
scene.add(hemi);

// ---------- 海面（法线图程序生成，可平铺） ----------
function makeWaterNormals(N = 256) {
  const rnd = mulberry32(7), waves = [];
  for (let i = 0; i < 56; i++) {
    const ang = rnd() * Math.PI * 2, k = 1 + Math.floor(Math.pow(rnd(), 1.6) * 26);
    const kx = Math.round(Math.cos(ang) * k), ky = Math.round(Math.sin(ang) * k);
    if (!kx && !ky) continue;
    waves.push([kx, ky, 1 / Math.pow(Math.hypot(kx, ky), 1.25), rnd() * 6.283]);
  }
  const H = new Float32Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    let h = 0; for (const w of waves) h += w[2] * Math.sin(6.2831853 * (w[0] * i + w[1] * j) / N + w[3]);
    H[j * N + i] = h;
  }
  const gx = new Float32Array(N * N), gy = new Float32Array(N * N); let gmax = 0;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const dx = H[j * N + (i + 1) % N] - H[j * N + (i - 1 + N) % N];
    const dy = H[((j + 1) % N) * N + i] - H[((j - 1 + N) % N) * N + i];
    gx[j * N + i] = dx; gy[j * N + i] = dy; gmax = Math.max(gmax, Math.abs(dx), Math.abs(dy));
  }
  const S = 1.6 / gmax, data = new Uint8Array(N * N * 4);
  for (let p = 0; p < N * N; p++) {
    let nx = -gx[p] * S, ny = -gy[p] * S, nz = 1; const l = Math.hypot(nx, ny, nz);
    data[p * 4] = (nx / l * 0.5 + 0.5) * 255; data[p * 4 + 1] = (ny / l * 0.5 + 0.5) * 255;
    data[p * 4 + 2] = (nz / l * 0.5 + 0.5) * 255; data[p * 4 + 3] = 255;
  }
  const t = new THREE.DataTexture(data, N, N);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; t.needsUpdate = true;
  return t;
}
const water = new Water(new THREE.PlaneGeometry(60000, 60000), {
  textureWidth: 512, textureHeight: 512, waterNormals: makeWaterNormals(),
  sunDirection: new THREE.Vector3(), sunColor: 0xffffff, waterColor: 0x06283a,
  distortionScale: 8, fog: true,
});
water.material.uniforms.size.value = 0.45;
water.rotation.x = -Math.PI / 2;
scene.add(water);

// ---------- 海岛（无限群岛：按 12 km 网格确定性生成，只给镜头附近的岛建网格） ----------
const HOME_ISLANDS = [
  { x: 700,   z: 4700,  r: 1600, peak: 600, seed: 3 },
  { x: -4200, z: -1800, r: 900,  peak: 300, seed: 11 },
  { x: 5600,  z: -8200, r: 2300, peak: 820, seed: 23, crater: true },
  { x: -1900, z: -4400, r: 700,  peak: 90,  seed: 31 },
  { x: -3600, z: 7600,  r: 1300, peak: 480, seed: 61 },
  { x: -9000, z: -7000, r: 1800, peak: 600, seed: 41 },
  { x: 7800,  z: 2600,  r: 1100, peak: 380, seed: 53 },
];
const CELL = 12000, BUILD_R = 24000, DROP_R = 30000;
const cellCache = new Map();
function cellIslands(cx, cz) {
  const key = cx + ',' + cz;
  let list = cellCache.get(key);
  if (list) return list;
  list = HOME_ISLANDS.filter((I) => Math.floor(I.x / CELL) === cx && Math.floor(I.z / CELL) === cz);
  if (cx < -1 || cx > 0 || cz < -1 || cz > 0) {   // 起始海域用手摆的岛，其余随机
    const rnd = mulberry32(Math.imul(cx, 73856093) ^ Math.imul(cz, 19349663) ^ 0x5bd1e995);
    const n = rnd() < 0.4 ? 0 : 1 + Math.floor(rnd() * 2);
    for (let k = 0; k < n; k++) {
      const big = rnd() < 0.12;
      const r = big ? 2800 + rnd() * 1700 : 500 + rnd() * 1900;
      const I = { x: 0, z: 0, r, peak: big ? 900 + rnd() * 700 : r * (0.08 + rnd() * 0.4), seed: (Math.abs(cx * 131 + cz * 977) + k * 17) % 9973 + 1 };
      I.crater = I.peak > 500 && rnd() < 0.25;
      for (let tries = 0; tries < 6; tries++) {
        I.x = (cx + 0.15 + rnd() * 0.7) * CELL; I.z = (cz + 0.15 + rnd() * 0.7) * CELL;
        if (list.every((J) => Math.hypot(I.x - J.x, I.z - J.z) > (I.r + J.r) * 1.25)) break;
      }
      list.push(I);
    }
  }
  cellCache.set(key, list);
  return list;
}
function islandH(I, x, z) {
  const lx = (x - I.x) / I.r, lz = (z - I.z) / I.r;
  const wx = lx + 0.45 * (fbm(lx * 1.1 + I.seed, lz * 1.1, I.seed, 4) - 0.5);
  const wz = lz + 0.45 * (fbm(lx * 1.1, lz * 1.1 + I.seed, I.seed + 5, 4) - 0.5);
  const d = Math.hypot(wx, wz);
  // 主峰 + 偏心副峰，山脊/沟谷噪声做出侵蚀感
  const d2 = Math.hypot(wx - 0.38 * Math.cos(I.seed), wz - 0.38 * Math.sin(I.seed)) / 0.55;
  const base = Math.max(Math.pow(Math.max(0, 1 - d), 1.35), 0.62 * Math.pow(Math.max(0, 1 - d2), 1.5));
  const r1 = 1 - Math.abs(2 * fbm(lx * 2.6 + 7, lz * 2.6, I.seed + 13, 5) - 1);
  const r2 = 1 - Math.abs(2 * fbm(lx * 6.5, lz * 6.5 + 3, I.seed + 19, 4) - 1);
  const ridge = r1 * r1 * 0.7 + r2 * r2 * 0.3;
  const n = fbm(lx * 9, lz * 9, I.seed + 9, 4);
  let h = I.peak * base * (0.45 + 0.9 * ridge) + I.peak * 0.05 * (n - 0.5) * Math.min(1, base * 4);
  if (I.crater) h -= I.peak * 0.22 * Math.exp(-Math.pow(d / 0.13, 2));
  h -= 22;
  if (d > 1) h -= (d - 1) * 120;
  if (h > 0) h = h < 14 ? h * h / 28 : h - 7;   // 沙滩压平
  return h;
}

const C = (hex) => new THREE.Color(hex);
const PAL = {
  wetSand: C(0x8f8160), sand: C(0xd6c69c), jungleA: C(0x1f3d17), jungleB: C(0x34561f),
  grass: C(0x5c6b30), rock: C(0x5a524a), darkRock: C(0x332e2b),
  deep: C(0x0f6f7a), shallow: C(0x6fe0cf), foam: C(0xf4f7f5),
};
const vegGeo = new THREE.IcosahedronGeometry(1, 0), vegMat = new THREE.MeshStandardMaterial({ roughness: 0.9, metalness: 0, flatShading: true });
function buildIsland(I) {
  const size = I.r * 2.7, seg = Math.round(Math.min(200, 70 + I.r / 20)), objs = [];
  const g = new THREE.PlaneGeometry(size, size, seg, seg); g.rotateX(-Math.PI / 2);
  const pos = g.attributes.position, n = pos.count, H = new Float32Array(n);
  for (let i = 0; i < n; i++) { const h = islandH(I, pos.getX(i) + I.x, pos.getZ(i) + I.z); H[i] = h; pos.setY(i, h); }
  g.computeVertexNormals();
  const nor = g.attributes.normal, cols = new Float32Array(n * 3), c = new THREE.Color();
  for (let i = 0; i < n; i++) {
    const h = H[i], x = pos.getX(i) + I.x, z = pos.getZ(i) + I.z, slope = 1 - nor.getY(i);
    const t = fbm(x * 0.004, z * 0.004, I.seed + 3, 3);
    c.copy(PAL.jungleA).lerp(PAL.jungleB, t);
    c.lerp(PAL.grass, smoothstep(I.peak * 0.55, I.peak * 0.85, h) * 0.8);
    c.lerp(PAL.rock, smoothstep(0.28, 0.5, slope));
    c.lerp(PAL.darkRock, smoothstep(I.peak * 0.85, I.peak * 1.05, h));
    c.lerp(PAL.sand, 1 - smoothstep(3, 9, h));
    c.lerp(PAL.wetSand, 1 - smoothstep(0, 1.6, h));
    cols.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  const mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0 }));
  mesh.position.set(I.x, 0, I.z);
  scene.add(mesh); objs.push(mesh);

  // 浅滩：沿真实海岸线的青绿色 + 白浪
  const g2 = new THREE.PlaneGeometry(size, size, seg, seg); g2.rotateX(-Math.PI / 2);
  const c4 = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) {
    const depth = -H[i];
    let a = depth <= 0 ? 0.9 : Math.pow(smoothstep(30, 0, depth), 1.4) * 0.8;
    c.copy(PAL.deep).lerp(PAL.shallow, smoothstep(30, 2, depth));
    const foam = (1 - smoothstep(0, 2.5, depth)) * 0.75;
    c.lerp(PAL.foam, foam); a = Math.max(a, foam);
    c4.set([c.r, c.g, c.b, a], i * 4);
  }
  g2.setAttribute('color', new THREE.BufferAttribute(c4, 4));
  const shallow = new THREE.Mesh(g2, new THREE.MeshLambertMaterial({ vertexColors: true, transparent: true, depthWrite: false }));
  shallow.position.set(I.x, 0.6, I.z);
  scene.add(shallow); objs.push(shallow);

  // 树冠
  const rnd = mulberry32(I.seed * 99), tries = Math.round(Math.min(I.r, 2600) ** 2 / 380), veg = [];
  for (let k = 0; k < tries; k++) {
    const x = I.x + (rnd() * 2 - 1) * I.r * 1.05, z = I.z + (rnd() * 2 - 1) * I.r * 1.05;
    const h = islandH(I, x, z);
    if (h < 6 || h > I.peak * 0.82) continue;
    const grad = Math.hypot(islandH(I, x + 4, z) - h, islandH(I, x, z + 4) - h) / 4;
    if (grad > 0.8 || fbm(x * 0.003, z * 0.003, I.seed + 70, 3) < 0.36) continue;
    veg.push([x, h, z, 6 + rnd() * 7, rnd()]);
  }
  const vm = new THREE.InstancedMesh(vegGeo, vegMat, Math.max(1, veg.length));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  vm.count = veg.length;
  veg.forEach(([x, h, z, sz, r], i) => {
    q.setFromEuler(new THREE.Euler(0, r * 6.28, 0));
    m.compose(p.set(x, h + sz * 0.35, z), q, s.set(sz, sz * 0.8, sz));
    vm.setMatrixAt(i, m);
    vm.setColorAt(i, c.copy(PAL.jungleA).lerp(PAL.jungleB, r).multiplyScalar(0.8 + r * 0.4));
  });
  scene.add(vm); objs.push(vm);
  return objs;
}
// 镜头附近的岛排队建网格（每几帧建一个，避免卡顿），远了就回收
const builtIslands = new Map(), buildQueue = [];
let islandTick = 0;
function updateIslands(cam, buildNow = false) {
  const cx0 = Math.floor(cam.x / CELL), cz0 = Math.floor(cam.z / CELL), k = Math.ceil(BUILD_R / CELL) + 1;
  for (let cx = cx0 - k; cx <= cx0 + k; cx++) for (let cz = cz0 - k; cz <= cz0 + k; cz++)
    for (const I of cellIslands(cx, cz)) {
      if (builtIslands.has(I) || buildQueue.includes(I)) continue;
      if (Math.hypot(I.x - cam.x, I.z - cam.z) - I.r < BUILD_R) buildQueue.push(I);
    }
  for (const [I, objs] of builtIslands) {
    if (Math.hypot(I.x - cam.x, I.z - cam.z) - I.r < DROP_R) continue;
    for (const o of objs) { scene.remove(o); if (o.geometry !== vegGeo) o.geometry.dispose(); if (o.material !== vegMat) o.material.dispose(); }

      if (boom) { fxExplosion(boom, ZERO, 0.6); blast(boom, m.owner); }
      else if (m.pos.y < gh) { if (gh <= 0.5) fxSplash(m.pos, 0.5); else fxExplosion(m.pos, ZERO, 0.4); }
      else fxExplosion(m.pos, ZERO, 0.35);
      scene.remove(m.mesh); missiles.splice(i, 1);
    }
  }
}
function blast(p, attacker) {
  for (const ac of aircraft) {
    if (ac === attacker || !ac.alive) continue;
    const d = ac.st.pos.distanceTo(p);
    if (d > 30) continue;
    const k = 380 * (1 - d / 30);
    for (const [part, w] of [['fuse', 0.5], ['wingL', 0.6], ['wingR', 0.6], ['tail', 0.6], ['engine', 0.5], ['pilot', 0.3]])
      ac.hp[part] -= k * w * rand(0.6, 1.4);
    ac.lastHit = gameTime; ac.lastAttacker = attacker;
    if (Math.random() < 0.5) ac.onFire = true;
    if (attacker === player) hitMark();
    checkDamage(ac);
  }
}
function sfxLaunch() { playBuf(audio?.boom, 0.5, 1400, 'bandpass', 1.8); }

// ---------- 声音（WebAudio 合成，无素材） ----------
let audio = null;
function noiseBuf(ac, secs, decay) {
  const b = ac.createBuffer(1, ac.sampleRate * secs, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / ac.sampleRate * decay);
  return b;
}
function initAudio() {
  if (audio) { audio.ac.resume(); return; }
  const ac = new AudioContext(), master = ac.createGain(); master.gain.value = 0.4; master.connect(ac.destination);
  const sfx = ac.createGain(); sfx.gain.value = 0.7; sfx.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 2;
  const eg = ac.createGain(); eg.gain.value = 0.25; lp.connect(eg); eg.connect(master);
  const o1 = ac.createOscillator(), o2 = ac.createOscillator(); o1.type = 'sawtooth'; o2.type = 'square';
  const pulse = ac.createOscillator(), pg = ac.createGain(); pulse.type = 'square'; pg.gain.value = 0.5;
  const am = ac.createGain(); am.gain.value = 0.6;
  pulse.connect(pg); pg.connect(am.gain); o1.connect(am); o2.connect(am); am.connect(lp);
  const noise = ac.createBufferSource(); noise.buffer = noiseBuf(ac, 2, 0); noise.loop = true;
  const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.6;
  const wg = ac.createGain(); wg.gain.value = 0; noise.connect(bp); bp.connect(wg); wg.connect(master);
  const lockOsc = ac.createOscillator(), lockG = ac.createGain(); lockOsc.type = 'square'; lockOsc.frequency.value = 1150; lockG.gain.value = 0;
  lockOsc.connect(lockG); lockG.connect(sfx);
  [o1, o2, pulse, noise, lockOsc].forEach((n) => n.start());
  audio = { ac, o1, o2, pulse, lp, wg, master, sfx, lockG, gun: noiseBuf(ac, 0.09, 45), boom: noiseBuf(ac, 2.2, 2.2), tick: noiseBuf(ac, 0.03, 160) };
}
function playBuf(buf, gain, freq, type = 'lowpass', rate = 1) {
  if (!audio || audio.ac.state !== 'running') return;
  const ac = audio.ac, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = buf; s.playbackRate.value = rate; f.type = type; f.frequency.value = freq; g.gain.value = gain;
  s.connect(f); f.connect(g); g.connect(audio.sfx); s.start();
}
function sfxGun() { playBuf(audio?.gun, 0.55, 2200, 'lowpass', rand(0.9, 1.1)); }
function sfxHit() { playBuf(audio?.tick, 0.5, 3200, 'bandpass', 1); }
function sfxBoom(p, k) {
  if (!player) return;
  const d = p.distanceTo(player.st.pos);
  playBuf(audio?.boom, Math.min(1.2, k * 1.4 / (1 + d / 350)), 380, 'lowpass', rand(0.8, 1));
}
function updateAudio() {
  if (!audio) return;
  const st = player.st, t = audio.ac.currentTime, dead = !player.alive, rpm = dead || player.engineDead ? 0 : 0.35 + 0.65 * st.thr;
  const f = 46 + rpm * 40 + st.V * 0.02;
  audio.o1.frequency.setTargetAtTime(f, t, 0.15);
  audio.o2.frequency.setTargetAtTime(f * 0.5, t, 0.15);
  audio.pulse.frequency.setTargetAtTime(f * 3.5, t, 0.15);
  audio.lp.frequency.setTargetAtTime(300 + rpm * 1500 + (st.thr > 0.85 ? 900 : 0), t, 0.2);
  audio.wg.gain.setTargetAtTime(dead ? 0 : Math.min(0.6, (st.V / 320) ** 2 * 0.2 + (st.thr > 0.85 ? 0.12 : 0) + Math.max(0, st.g - 4) * 0.04), t, 0.2);
  audio.master.gain.setTargetAtTime(dead ? 0 : 0.4, t, 0.3);
  const lg = !lock.target || dead ? 0 : lock.t >= 1 ? 0.035 : (gameTime * 7) % 1 < 0.45 ? 0.03 : 0;   // 锁定中嘀嘀，锁定后长音
  audio.lockG.gain.setTargetAtTime(lg, t, 0.01);
}

// ---------- 镜头 ----------
const cam = { offset: new THREE.Vector3(0, 6, -32), dist: 32, free: false };
let aimYaw = 0, aimPitch = 0, freeYaw = 0, freePitch = 0;
function syncAimAngles() { const d = player.aimDir; aimYaw = Math.atan2(d.x, d.z); aimPitch = Math.asin(THREE.MathUtils.clamp(d.y, -1, 1)); }
function dirFromAngles(yaw, pitch, out) { return out.set(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch)); }
function updateCamera(dt) {
  const look = cam.free ? dirFromAngles(freeYaw, freePitch, _a) : _a.copy(player.aimDir);
  const target = _b.copy(look).multiplyScalar(-cam.dist).addScaledVector(UP, cam.dist * 0.2);
  cam.offset.lerp(target, 1 - Math.exp(-dt * 10));
  camera.position.copy(player.st.pos).add(cam.offset);
  camera.lookAt(_c.copy(player.st.pos).addScaledVector(look, 120).addScaledVector(UP, cam.dist * 0.15));
  const fov = 50 + 16 * smoothstep(150, 650, player.st.V);   // 越快视野越广，增强速度感
  if (Math.abs(camera.fov - fov) > 0.05) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix(); }
}

// ---------- HUD ----------
const $ = (id) => document.getElementById(id);
const hud = { aim: $('aim'), nose: $('nose'), spd: $('spd'), alt: $('alt'), thr: $('thr'), gl: $('gl'), hdg: $('hdg'),
              warn: $('warn'), msl: $('msl'), lead: $('lead'), kn: $('kn'), msg: $('msg') };
const tgtEls = Array.from({ length: 8 }, () => { const e = document.createElement('div'); e.className = 'tgt'; e.innerHTML = '<span></span>'; $('hud').appendChild(e); return e; });
let warnSticky = false, msgT = 0, hitT = 0;
function showWarn(t, sticky = false) { hud.warn.textContent = t; hud.warn.style.opacity = t ? 1 : 0; warnSticky = sticky; }
function showMsg(t) { hud.msg.textContent = t; hud.msg.style.opacity = 1; msgT = 1.8; }
function hitMark() { hitT = 0.12; sfxHit(); }
function screenPos(v) {
  const p = _d.copy(v).project(camera);
  return { x: (p.x * 0.5 + 0.5) * innerWidth, y: (-p.y * 0.5 + 0.5) * innerHeight, behind: p.z > 1, nx: p.x, ny: p.y };
}
function place(el, v) {
  const s = screenPos(v);
  el.style.opacity = s.behind ? 0 : 1;
  el.style.transform = `translate(${s.x}px, ${s.y}px)`;
  return s;
}
function updateHUD(dt) {
  const st = player.st;
  place(hud.aim, _a.copy(st.pos).addScaledVector(player.aimDir, 1500));
  place(hud.nose, _a.set(0, -GUN_DOWN, 1).normalize().applyQuaternion(st.q).multiplyScalar(1500).add(st.pos));
  hud.nose.classList.toggle('hit', (hitT -= dt) > 0);
  hud.spd.textContent = Math.round(st.V * 3.6);
  $('mach').textContent = 'M ' + (st.mach || 0).toFixed(2);
  hud.alt.textContent = Math.round(st.pos.y);
  hud.thr.textContent = Math.round(st.thr * 100);
  hud.gl.textContent = st.g.toFixed(1);
  hud.msl.textContent = player.slots ? player.slots.filter((s) => s.ready).length : 0;
  hud.kn.textContent = kills;
  if ((msgT -= dt) <= 0) hud.msg.style.opacity = 0;
  const f = _a.set(0, 0, 1).applyQuaternion(st.q);
  hud.hdg.textContent = String(Math.round((THREE.MathUtils.radToDeg(Math.atan2(f.x, f.z)) + 360) % 360)).padStart(3, '0');

  // 敌机标记：屏内方框+距离，屏外贴边圆点
  let k = 0, leadTgt = null, leadBest = 0.5;
  const nose = V3().set(0, -GUN_DOWN, 1).normalize().applyQuaternion(st.q);
  for (const ac of aircraft) {
    if (ac === player || !ac.alive || k >= tgtEls.length) continue;
    const el = tgtEls[k++], s = screenPos(ac.st.pos), dist = ac.st.pos.distanceTo(st.pos);
    let x = s.x, y = s.y, off = s.behind || x < 0 || y < 0 || x > innerWidth || y > innerHeight;
    if (off) {
      let dx = s.behind ? -s.nx : s.nx, dy = s.behind ? s.ny : -s.ny;
      const m = Math.max(Math.abs(dx), Math.abs(dy)) || 1;
      x = innerWidth / 2 + dx / m * (innerWidth / 2 - 30); y = innerHeight / 2 + dy / m * (innerHeight / 2 - 30);
    }
    const lk = !off && ac === lock.target ? (lock.t >= 1 ? ' locked' : ' locking') : '';
    el.className = 'tgt' + (off ? ' off' : '') + (ac.doomed ? ' down' : '') + lk;
    el.style.opacity = 1; el.style.transform = `translate(${x}px, ${y}px)`;
    el.firstChild.textContent = off ? '' : (lk === ' locked' ? '锁定 ' : '') + (dist < 1000 ? Math.round(dist) + ' m' : (dist / 1000).toFixed(1) + ' km');
    const cosA = _b.subVectors(ac.st.pos, st.pos).normalize().dot(nose);
    if (!ac.doomed && dist < 2000 && cosA > Math.cos(0.5) && cosA > leadBest) { leadBest = cosA; leadTgt = ac; }
  }
  for (; k < tgtEls.length; k++) tgtEls[k].style.opacity = 0;
  // 提前量：子弹飞到目标所需时间内，目标相对我方的位移 + 子弹下坠
  if (leadTgt && player.alive) {
    let t = leadTgt.st.pos.distanceTo(st.pos) / GUN_V;
    const lp = V3();
    for (let i = 0; i < 2; i++) {
      lp.copy(leadTgt.st.pos).addScaledVector(_b.subVectors(leadTgt.st.vel, st.vel), t).addScaledVector(UP, 4.9 * t * t);
      t = lp.distanceTo(st.pos) / GUN_V;
    }
    place(hud.lead, lp);
    leadAim.ok = true; leadAim.p.copy(lp);
  } else { hud.lead.style.opacity = 0; leadAim.ok = false; }

  if (warnSticky) return;
  const agl = st.pos.y - groundH(st.pos.x, st.pos.z);
  if (st.stalled) showWarn('失速');
  else if (agl < 120 && st.vel.y < -15) showWarn('拉起！');
  else if (st.g > 7) showWarn('过载');
  else showWarn('');
}

// ---------- 输入 ----------
const startEl = $('start');
const params = new URLSearchParams(location.search);
let running = params.has('autostart'), mouseDown = false;
if (running) startEl.style.display = 'none';
startEl.addEventListener('click', (e) => { if (e.target.closest('#hangar') || !booted) return; renderer.domElement.requestPointerLock(); initAudio(); });
document.addEventListener('pointerlockchange', () => {
  running = document.pointerLockElement === renderer.domElement;
  startEl.style.display = running ? 'none' : 'flex';
  if (!running) { mouseDown = false; if (audio) audio.ac.suspend(); }
});
addEventListener('mousedown', (e) => { if (running && e.button === 0) mouseDown = true; if (running && e.button === 2) launchMissile(player); });
addEventListener('contextmenu', (e) => e.preventDefault());
addEventListener('mouseup', (e) => { if (e.button === 0) mouseDown = false; });
document.addEventListener('mousemove', (e) => {
  if (!running) return;
  const s = 0.0022;
  if (cam.free) { freeYaw -= e.movementX * s; freePitch = THREE.MathUtils.clamp(freePitch - e.movementY * s, -1.4, 1.4); return; }
  aimYaw -= e.movementX * s; aimPitch = THREE.MathUtils.clamp(aimPitch - e.movementY * s, -1.5, 1.5);
  dirFromAngles(aimYaw, aimPitch, player.aimDir);
});
let playerType = 'F-22';
function respawnPlayer(first) {
  const last = player.st.pos.clone(), f = first ? V3().set(-0.34, 0, 0.94).normalize() : V3().set(0, 0, 1).applyQuaternion(player.st.q).setY(0).normalize();
  const pos = first ? V3().set(2400, 1000, 900) : last.setY(Math.max(1000, groundH(last.x, last.z) + 500));
  player.reset(pos, f.lengthSq() > 0.5 ? f : V3().set(0, 0, 1), 250, playerType);
  syncAimAngles(); showWarn('');
}
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR') respawnPlayer(false);
  if (e.code === 'KeyF' && running && !e.repeat) launchMissile(player);
  if (e.code === 'KeyC' && !cam.free) { cam.free = true; freeYaw = aimYaw; freePitch = aimPitch; }
  if (e.code === 'KeyV') cam.dist = cam.dist > 40 ? 20 : cam.dist > 25 ? 55 : 32;
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', (e) => { keys[e.code] = false; if (e.code === 'KeyC') cam.free = false; });

const sunInput = $('sun'), sunV = $('sunv');
sunInput.addEventListener('input', () => { P.sunElev = +sunInput.value; sunV.textContent = P.sunElev + '°'; updateSun(); updateSmokeTint(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  bloom.setSize(innerWidth / 2, innerHeight / 2);
  tracers.material.uniforms.uRes.value = innerHeight;
});

// ---------- 主循环 ----------
player = new Aircraft(true);
aircraft.push(player);
let booted = false;
// 机库：点缩略图换机（暂停时也能换，换完从当前位置重新起飞）
const hangarEl = $('hangar');
for (const id of JET_IDS) {
  const b = document.createElement('button'); b.dataset.id = id;
  b.innerHTML = `<img src="assets/thumbs/${id}.jpg" alt=""><span>${JETS[id].cn}</span>`;
  b.addEventListener('click', () => {
    if (id === playerType) return;
    b.classList.add('loading');
    loadJet(id).then(() => {
      b.classList.remove('loading'); playerType = id; markHangar();
      if (booted) respawnPlayer(!player.mesh);
    });
  });
  hangarEl.appendChild(b);
}
function markHangar() { for (const b of hangarEl.children) b.classList.toggle('sel', b.dataset.id === playerType); }
markHangar();
async function boot() {
  // 先加载玩家机和 3 种敌机，其余机型在后台慢慢加载
  const others = JET_IDS.filter((id) => id !== playerType).sort(() => Math.random() - 0.5);
  await Promise.all([playerType, ...others.slice(0, 3)].map(loadJet));
  respawnPlayer(true);
  for (let i = 0; i < 4; i++) spawnEnemy();
  booted = true;
  const l = $('loading'); l.style.opacity = 0; setTimeout(() => l.remove(), 1000);
  /*SELFTEST*/
  for (const id of others.slice(3)) { await new Promise((r) => setTimeout(r, 400)); await loadJet(id); }
}
boot();
const clock = new THREE.Clock();
function stepWorld(dt) {
  gameTime += dt;
  if (player.alive) {
    if (keys.KeyW) player.st.thr = Math.min(1, player.st.thr + dt * 0.5);
    if (keys.KeyS) player.st.thr = Math.max(0, player.st.thr - dt * 0.5);
    player.firing = mouseDown || keys.Space;
    autopilot(player);
  }
  for (const ac of aircraft) if (ac !== player && ac.alive) enemyBrain(ac);
  const n = Math.ceil(dt / (1 / 120));
  for (let i = 0; i < n; i++) for (const ac of aircraft) if (ac.alive) physicsStep(ac, dt / n);
  for (const ac of aircraft) {
    if (!ac.alive) continue;
    ac.mesh.position.copy(ac.st.pos); ac.mesh.quaternion.copy(ac.st.q); ac.mesh.updateMatrixWorld();
    if (ac.prop) ac.prop.rotation.z += dt * (ac.engineDead ? 6 : 20 + 40 * ac.st.thr);
    fireGuns(ac, dt);
    aircraftFx(ac, dt);
  }
  // 相撞
  if (player.alive) for (const ac of aircraft) {
    if (ac === player || !ac.alive || ac.st.pos.distanceToSquared(player.st.pos) > (0.4 * (ac.jet.len + player.jet.len)) ** 2) continue;
    ac.lastAttacker = player; explodeAir(ac); fxExplosion(player.st.pos, player.st.vel, 1);
    player.alive = false; player.mesh.visible = false; showWarn('相撞坠毁 · 按 R 重新起飞', true);
  }
  updateBullets(dt);
  updateDebris(dt);
  updateLock(dt);
  updateMissiles(dt);
  for (let i = aircraft.length - 1; i >= 0; i--) {
    const ac = aircraft[i];
    if (ac === player || ac.alive) continue;
    scene.remove(ac.mesh); disposeTree(ac.mesh); aircraft.splice(i, 1);
    spawnQueue.push(gameTime + 6);
  }
  while (spawnQueue.length && spawnQueue[0] <= gameTime) { spawnQueue.shift(); spawnEnemy(); }
  flash.intensity *= Math.exp(-dt * 9);
}
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (running && booted) stepWorld(dt);
  smokeFx.flush(); glowFx.flush();
  updateCamera(dt);
  water.position.x = camera.position.x; water.position.z = camera.position.z;
  cloudMat.uniforms.uCam.value.copy(camera.position);
  sky.position.copy(camera.position);   // 天空盒跟着镜头，飞多远都在盒子里
  tickIslands(camera.position);
  water.material.uniforms.time.value += dt * 0.8;
  composer.render();
  if (booted) { updateHUD(dt); updateAudio(); }
});
</script>
